{#- Thread list (legacy forum.php donothing()). -#}
<table class="forum">
<thead>
<tr><th colspan="3" class="forum-new"><a href="/forum/new">New Thread</a></th></tr>
<tr><th class="forum-col-thread">Thread</th><th class="forum-col-replies">Replies</th><th>Last Post</th></tr>
</thead>
<tbody>
{%- if #threads == 0 then %}
<tr><td colspan="3"><b>No threads in forum.</b></td></tr>
{%- end %}
{%- for _, t in ipairs(threads) do %}
<tr><td><a href="/forum/thread/{{ t.id }}">{{ t.title }}</a></td><td>{{ t.replies }}</td><td>{{ datetime(t.newpostdate) }}</td></tr>
{%- end %}
</tbody>
</table>
{{{ include("community/forum/pager") }}}
