{#- New thread form (legacy forum.php newthread()): the way back, then the form on a
		parchment sheet. -#}
<nav class="forum-bar" aria-label="Forum"><span class="forum-crumbs"><a href="/forum">Forum</a> &rsaquo; <a href="/forum/{{ board.id }}">{{ board.name }}</a> &rsaquo; New Thread</span></nav>
<div class="forum-sheet">
<form class="forum-form forum-form-new" action="/forum/{{ board.id }}/new" method="post">
{{{ csrf_field() }}}
<h1 class="forum-title">Make A New Post</h1>
{%- if errors then %}
<p class="error">
{%- for _, e in ipairs(errors) do %}
{{ e }}<br>
{%- end %}
</p>
{%- end %}
<label class="forum-label" for="forum-new-title">Title</label>
<input id="forum-new-title" type="text" name="title" maxlength="{{ title_max }}" value="{{ draft.title }}" required>
<label class="forum-label" for="forum-new-content">Message</label>
<textarea id="forum-new-content" name="content" rows="8" required>
{{ draft.content }}</textarea>
<div class="forum-form-actions"><button class="forum-button" type="submit" name="submit" value="Submit">Post Thread</button></div>
</form>
</div>
