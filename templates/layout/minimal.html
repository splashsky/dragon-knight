<!doctype html>
<html lang="en"{{{ hashes() }}}>
<head>
<title>{{ title }}</title>
{{{ region("head") }}}{{{ include("layout/head") }}}{{{ endregion() }}}
</head>
{{{ region("root") }}}<body class="minimal theme-{{ theme.key }}{% if body_class then %} {{ body_class }}{% end %}"{{{ include("layout/live_attrs") }}}>

{{{ include("layout/protos") }}}

</html>
