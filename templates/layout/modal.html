{#- A page as a modal shows it (public/js/modal.js; docs/APP.md "Modals"): the title as the
		dialog's heading and the page's content, nothing of the layout. ctx: title, content
		(rendered HTML). -#}
<h2 class="dk-modal-title" id="dk-modal-title">{{ title }}</h2>
<div class="dk-modal-content">{{{ content }}}</div>
