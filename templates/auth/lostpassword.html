{%- if error then %}
<p class="error">{{ error }}</p>
{%- end %}
<form action="/lostpassword" method="post">
{{{ csrf_field() }}}
<table class="form-table" style="width: 80%">
<tr><td colspan="2">If you've lost your password, enter your email address below and you will be sent a new one.</td></tr>
<tr><td style="width: 20%">Email Address:</td><td><input type="email" name="email" size="30" maxlength="100" value="{{ email }}" required></td></tr>
<tr><td colspan="2"><button class="dk-btn dk-btn-primary" type="submit" name="submit" value="Submit">Submit</button> <button class="dk-btn dk-btn-secondary" type="reset" name="reset" value="Reset">Reset</button></td></tr>
</table>
</form>
