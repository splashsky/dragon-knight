{%- if error then %}
<p class="error">{{ error }}</p>
{%- end %}
<form action="/changepassword" method="post">
{{{ csrf_field() }}}
<table class="form-table" style="width: 100%">
<tr><td colspan="2">Use the form below to change your password. All fields are required.</td></tr>
<tr><td style="width: 20%">Username:</td><td><input type="text" name="username" size="30" maxlength="30" value="{{ username }}" autocomplete="username" required></td></tr>
<tr><td>Old Password:</td><td><input type="password" name="oldpass" size="20" autocomplete="current-password" required></td></tr>
<tr><td>New Password:</td><td><input type="password" name="newpass1" size="20" autocomplete="new-password" required></td></tr>
<tr><td>Verify New Password:</td><td><input type="password" name="newpass2" size="20" autocomplete="new-password" required><br><br><br></td></tr>
<tr><td colspan="2"><input type="submit" name="submit" value="Submit"> <input type="reset" name="reset" value="Reset"></td></tr>
</table>
</form>
