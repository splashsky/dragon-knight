{%- if error then %}
<p class="error">{{ error }}</p>
{%- end %}
<form action="/verify" method="post">
{{{ csrf_field() }}}
<table class="form-table" style="width: 80%">
<tr><td colspan="2">Thank you for registering a character. Please enter your username, email address, and the verification code
that was emailed to you to unlock your character.</td></tr>
<tr><td style="width: 20%">Username:</td><td><input type="text" name="username" size="30" maxlength="30" value="{{ username }}" required></td></tr>
<tr><td>Email Address:</td><td><input type="email" name="email" size="30" maxlength="100" value="{{ email }}" required></td></tr>
<tr><td>Verification Code:</td><td><input type="text" name="verify" size="10" maxlength="8" autocomplete="off" required><br><br><br></td></tr>
<tr><td colspan="2"><input type="submit" name="submit" value="Submit"> <input type="reset" name="reset" value="Reset"></td></tr>
</table>
</form>
