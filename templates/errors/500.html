<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Internal Server Error</title>
<link rel="stylesheet" href="/static/css/dk.css">
{%- if theme then %}
<link rel="stylesheet" href="{{ theme.stylesheet }}">
{%- end %}
</head>
<body{% if theme then %} class="theme-{{ theme.key }}"{% end %}>
<div class="dk-page">
<h1 class="title page-title">Internal Server Error</h1>
<p>Something went wrong while handling your request. Please go back and try again.</p>
{%- if detail then %}
<pre>{{ detail }}</pre>
{%- end %}
</div>
</body>
</html>
